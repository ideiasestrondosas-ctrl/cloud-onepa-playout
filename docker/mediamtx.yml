# MediaMTX Configuration for ONEPA Playout PRO
 
# Authentication settings
authMethod: internal
authInternalUsers:
  - user: "any"
    pass: ""
    permissions:
      - action: api
      - action: read
      - action: publish

# Listeners
rtmp: yes
hls: yes
webrtc: yes
srt: yes
rtsp: yes

# Listener ports
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8989
srtAddress: :8890

# HLS settings — Phase 4: LL-HLS (Low-Latency HLS)
# lowLatency variant enables CMAF chunked transfer with partial segments
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 100ms
hlsMuxerCloseAfter: 60s
hlsAlwaysRemux: yes

# API settings
api: yes
apiAddress: :9997

# Path settings
paths:
  # Raw feed (no graphics) — for GraphicsEditor preview
  raw:
    # FFmpeg pushes raw feed here WITHOUT logo overlay
  # Master feed (FFmpeg push point) — with graphics applied
  master:
    # RTMP pushes to this path will be accepted anonymously
  # Final distribution point (relayed from master)
  stream:
    # This matches the internal relay path in engine.rs
  all:
