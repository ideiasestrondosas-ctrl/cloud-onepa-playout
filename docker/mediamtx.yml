# MediaMTX Configuration for ONEPA Playout PRO

# Global authentication
authMethod: internal
authInternalUsers:
  - user: backend
    pass: backend
    permissions:
      - action: api
      - action: read
      - action: publish
  - user: any
    pass: ""
    permissions:
      - action: read

# Listeners
rtmp: yes
hls: yes
webrtc: yes
srt: yes
rtsp: yes

# Listener ports
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8989
srtAddress: :8890

# HLS settings
hlsVariant: lowLatency
hlsSegmentCount: 5
hlsSegmentDuration: 2s
hlsPartDuration: 200ms

# API settings
api: yes
apiAddress: :9997

# Path settings
paths:
  # Internal master feed — engine pushes here via RTMP
  # Path name: "master" (matches rtmp://mediamtx:1935/master)
  master:
    source: publisher
    sourceOnDemand: no
    readUser: backend
    readPass: backend
    publishUser: backend
    publishPass: backend

  # RTMP distribution relay target
  # Relay process reads from master and pushes here
  live/stream:
    source: publisher
    sourceOnDemand: no
    readUser: ""
    readPass: ""
    publishUser: ""
    publishPass: ""

  # SRT distribution relay target
  live/stream_srt:
    source: publisher
    sourceOnDemand: no
    readUser: ""
    readPass: ""
    publishUser: ""
    publishPass: ""

  # Clean master feed (no overlay) for GraphicsEditor preview
  master_clean:
    source: publisher
    sourceOnDemand: no
    readUser: backend
    readPass: backend
    publishUser: backend
    publishPass: backend

  # Catch-all for any other paths (HLS preview, etc.)
  all:
    source: publisher
