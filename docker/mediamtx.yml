# MediaMTX Configuration for ONEPA Playout PRO
 
# Authentication settings
authMethod: internal
authInternalUsers:
  - user: "any"
    pass: ""
    permissions:
      - action: api
      - action: read
      - action: publish

# Listeners
rtmp: yes
hls: yes
webrtc: yes
srt: yes
rtsp: yes

# Listener ports
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8989
srtAddress: :8890

# HLS settings
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 2s
hlsPartDuration: 200ms
hlsMuxerCloseAfter: 60s
hlsAlwaysRemux: yes

# API settings
api: yes
apiAddress: :9997

# Path settings
paths:
  # Master feed (FFmpeg push point)
  master:
    # RTMP pushes to this path will be accepted anonymously
  # Final distribution point (relayed from master)
  live/stream:
    # This matches the internal relay path in engine.rs
  all:
