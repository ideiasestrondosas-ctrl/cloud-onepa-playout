
server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    client_max_body_size 0;

    root /usr/share/nginx/html;
    index index.html;



    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Prevent caching of HTML files
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching of JS and CSS files
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Specifically for index.html to ensure it's never cached
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Proxy API requests to backend
    location /api {
        proxy_pass http://backend:8181;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy HLS streams (legacy from backend disk)
    location /hls {
        proxy_pass http://backend:8181;
        # Backend already sends CORS headers via Actix Cors middleware
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # HLS Live Stream Proxy (MediaMTX in-memory HLS)
    # NOTE: Use 'no-cache' (allows revalidation) NOT 'no-store' (breaks LL-HLS partial segments)
    location /hls-live/ {
        proxy_pass http://mediamtx:8888/;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            application/octet-stream mp4;
        }
    }

    # Proxy Assets (Video Branding)
    location /assets {
        proxy_pass http://backend:8181;
        # Backend already sends CORS headers via Actix Cors middleware
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
