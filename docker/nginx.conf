server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Custom log format for HLS session tracking (Syslog format)
    log_format hls_sessions 'IP=$remote_addr REQ=$request STAT=$status';

    # React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy - optimized for streaming
    location /api {
        proxy_pass http://backend:8181;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Streaming optimizations
        proxy_buffering off;           # Disable buffering for real-time streaming
        proxy_request_buffering off;   # Stream request body directly
        proxy_read_timeout 300s;       # Longer timeout for large files
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;  # Support chunked encoding
    }

    # HLS Stream (served from disk - generated by FFmpeg)
    location /hls {
        alias /var/lib/onepa-playout/hls;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control no-cache;
        add_header Accept-Ranges bytes;  # Enable range requests for TS files
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        
        # Optimize HLS segment delivery
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # Assets
    location /assets {
        proxy_pass http://backend:8181;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
