server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip Compression (higher level = less bandwidth globally) ───────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript
        application/json application/xml application/rss+xml
        application/atom+xml application/manifest+json
        image/svg+xml font/opentype application/font-woff
        application/font-woff2 application/vnd.ms-fontobject;

    # ─── Security Headers (lightweight but professional) ─────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Connection Efficiency ────────────────────────────────────────────────
    keepalive_timeout 75;
    keepalive_requests 500;

    # ─── React Router SPA support ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # HTML must NOT be cached to always get the latest JS chunk hashes
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ─── API proxy (streaming-optimised, zero-buffering) ─────────────────────
    location /api {
        proxy_pass http://backend:8181;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Streaming: disable buffering for real-time data
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;

        proxy_buffer_size 4k;
        proxy_busy_buffers_size 8k;
    }

    # ─── HLS Stream segments (generated by FFmpeg, never cached) ─────────────
    location /hls {
        alias /var/lib/onepa-playout/hls;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store";
        add_header Accept-Ranges bytes;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # ─── Dynamic Assets (thumbnails, uploaded media) — short-lived cache ──────
    location /assets {
        proxy_pass http://backend:8181;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    # ─── Immutable Static Assets (JS, CSS, fonts with hash in filename) ───────
    # Vite outputs files like /static/index-AbCdEf12.js — these are immutable.
    location ~* /static/.*\.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Other static files (images, icons, svgs) ─────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }
}
