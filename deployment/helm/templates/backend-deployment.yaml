apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onepa.name" . }}-backend
  labels:
    {{- include "onepa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      app: onepa-backend
  template:
    metadata:
      labels:
        app: onepa-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.username }}:$(POSTGRES_PASSWORD)@onepa-postgres:5432/{{ .Values.postgres.database }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onepa-secrets
                  key: postgres-password
            - name: REDIS_URL
              value: redis://onepa-redis:6379
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: onepa-secrets
                  key: jwt-secret
            - name: STORAGE_BACKEND
              value: {{ .Values.backend.storageBackend }}
            - name: S3_ENDPOINT
              value: http://onepa-minio:9000
            - name: S3_BUCKET
              value: {{ .Values.minio.bucket }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: onepa-secrets
                  key: minio-root-user
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: onepa-secrets
                  key: minio-root-password
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "{{ .Values.backend.port }}"
            - name: MEDIAMTX_HOST
              value: onepa-mediamtx
          ports:
            - containerPort: {{ .Values.backend.port }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: onepa-backend
spec:
  selector:
    app: onepa-backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
