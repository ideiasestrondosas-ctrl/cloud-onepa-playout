{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onepa.name" . }}-redis
  labels:
    {{- include "onepa.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onepa-redis
  template:
    metadata:
      labels:
        app: onepa-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.images.redis.repository }}:{{ .Values.images.redis.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: onepa-redis
spec:
  selector:
    app: onepa-redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
