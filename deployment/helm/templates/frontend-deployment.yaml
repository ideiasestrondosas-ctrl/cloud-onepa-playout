apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onepa.name" . }}-frontend
  labels:
    {{- include "onepa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.frontend }}
  selector:
    matchLabels:
      app: onepa-frontend
  template:
    metadata:
      labels:
        app: onepa-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: onepa-frontend
spec:
  selector:
    app: onepa-frontend
  ports:
    - port: 80
      targetPort: 80
